services:
  public-api:
    build: ./public-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - public-api

volumes:
  caddy_data:
  caddy_config: