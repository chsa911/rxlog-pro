services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    command: ["start-dev"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # optional but can help locally in some setups:
      # KC_HOSTNAME_STRICT: "false"

  gateway-java-spring:
    build:
      context: ./gateway-java-spring
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - REGISTER_URL=http://bookservice-java-spring:8086
      - BARCODES_URL=http://barcodes-go:8082
      - JAVA_TOOL_OPTIONS=-Dserver.ssl.enabled=false
      - SPRING_APPLICATION_JSON={"server":{"ssl":{"enabled":false}}}
      # Keycloak JWT validation (inside docker network use service name "keycloak"):
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/rxlog
    depends_on:
      - bookservice-java-spring
      - barcodes-go
      - keycloak

  bookservice-java-spring:
    build:
      context: ./services/bookservice-java-spring
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DB}?sslmode=require
      - SPRING_DATASOURCE_USERNAME=${NEON_USER}
      - SPRING_DATASOURCE_PASSWORD=${NEON_PASSWORD}
      - SERVER_PORT=8086
      - barcode.service.base=http://barcodes-go:8082
      - SPRING_FLYWAY_ENABLED=false
      # Keycloak JWT validation (inside docker network use service name "keycloak"):
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/rxlog
    depends_on:
      - redis
      - keycloak

  enrichment-java-spring:
    build:
      context: ./services/enrichment-java-spring
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DB}?sslmode=require
      - SPRING_DATASOURCE_USERNAME=${NEON_USER}
      - SPRING_DATASOURCE_PASSWORD=${NEON_PASSWORD}
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_APPLICATION_JSON={"spring":{"flyway":{"enabled":false}},"bookservice":{"baseUrl":"http://bookservice-java-spring:8086"},"worker":{"enabled":true,"batchSize":100,"pollDelayMs":200}}
    depends_on:
      - bookservice-java-spring
      - keycloak

  barcodes-go:
    build:
      context: ./services/barcodes-go
    environment:
      - DATABASE_URL=postgres://${NEON_USER}:${NEON_PASSWORD}@${NEON_HOST}:5432/${NEON_DB}?sslmode=require
      - REDIS_ADDR=redis:6379
      - SERVICE_PORT=8082
      - SIZERULES_FILE=/config/sizerules.csv
      - BARCODE_RANKING_FILE=/config/barcode-ranking.txt
    depends_on:
      - redis
    volumes:
      - ./config:/config
    ports:
      - "8082:8082"

  nginx:
    image: nginx:stable
    platform: linux/arm64
    ports:
      - "8089:80"
    volumes:
      - ./frontend-analytics/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/var/www/html:ro
    depends_on:
          - gateway-java-spring

