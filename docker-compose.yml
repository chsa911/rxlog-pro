services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway-java-spring:
    build:
      context: ./gateway-java-spring
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - REGISTER_URL=http://bookservice-java-spring:8086
      - BARCODES_URL=http://barcodes-go:8082
      - JAVA_TOOL_OPTIONS=-Dserver.ssl.enabled=false
      - SPRING_APPLICATION_JSON={"server":{"ssl":{"enabled":false}}}
    depends_on:
      - bookservice-java-spring
      - barcodes-go

  bookservice-java-spring:
    build:
      context: ./services/bookservice-java-spring
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DB}?sslmode=require
      - SPRING_DATASOURCE_USERNAME=${NEON_USER}
      - SPRING_DATASOURCE_PASSWORD=${NEON_PASSWORD}
      - SERVER_PORT=8086
      - barcode.service.base=http://barcodes-go:8082
      - SPRING_FLYWAY_ENABLED=false
    depends_on:
      - redis

  enrichment-java-spring:
    build:
      context: ./services/enrichment-java-spring
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${NEON_HOST}:5432/${NEON_DB}?sslmode=require
      - SPRING_DATASOURCE_USERNAME=${NEON_USER}
      - SPRING_DATASOURCE_PASSWORD=${NEON_PASSWORD}
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_APPLICATION_JSON={"spring":{"flyway":{"enabled":false}},"bookservice":{"baseUrl":"http://bookservice-java-spring:8086"},"worker":{"enabled":true,"batchSize":100,"pollDelayMs":200}}
    depends_on:
      - bookservice-java-spring

  barcodes-go:
    build:
      context: ./services/barcodes-go
    environment:
      - DATABASE_URL=postgres://${NEON_USER}:${NEON_PASSWORD}@${NEON_HOST}:5432/${NEON_DB}?sslmode=require
      - REDIS_ADDR=redis:6379
      - SERVICE_PORT=8082
      - SIZERULES_FILE=/config/sizerules.csv
      - BARCODE_RANKING_FILE=/config/barcode-ranking.txt
    depends_on:
      - redis
    volumes:
      - ./config:/config
    ports:
      - "8082:8082"