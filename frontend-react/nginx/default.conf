server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/public/   { proxy_pass http://public-api:3000; }
  location /api/register/ { proxy_pass http://public-api:3000; }
  location /api/mobile/   { proxy_pass http://public-api:3000; }

  location /api/barcodes/ { proxy_pass http://barcodes:8080; }

  location / {
    try_files $uri /index.html;
  }
}