server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: false

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: register
          uri: ${REGISTER_URL:http://localhost:8086}
          predicates:
            - Path=/api/register/**
        - id: mobile
          uri: ${REGISTER_URL:http://localhost:8086}
          predicates:
            - Path=/api/mobile/**
        - id: barcodes
          uri: ${BARCODES_URL:http://localhost:8087}
          predicates:
            - Path=/api/barcodes/**
management:
  endpoints:
    web:
      exposure:
        include: health,info